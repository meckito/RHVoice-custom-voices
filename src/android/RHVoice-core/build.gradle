apply plugin: 'com.android.application'

ext.major_version = 1
ext.minor_version = 18
ext.revision_number = 4
ext.baseVersionCode = 100000 * major_version + 1000 * minor_version + 10 * revision_number


task BoostIncludes(type: Exec) {
    workingDir '../../..'
    commandLine 'scons', 'external/libs/boost/include/boost'
}

android {
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    compileSdk myCompileSdkVersion
    buildToolsVersion myBuildToolsVersion
    ndkVersion myNdkVersion
    namespace "com.github.olga_yakovleva.rhvoice.android"

    buildFeatures {
        prefab true
        buildConfig true
    }

    defaultConfig {
        multiDexEnabled true
        minSdk myMinSdkVersion
        targetSdk myTargetSdkVersion
        applicationId "org.tomecki.rhvoice.customvoices"
        versionName "${major_version}.${minor_version}.${revision_number}"
        ndk {
            abiFilters 'armeabi-v7a', 'x86', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            ndkBuild {
                arguments 'V=1'
                cppFlags = ['-fexceptions', '-frtti', '-std=c++11']
            }
        }
    }

    if (rootProject.signRelease) {
        signingConfigs {
            release {
                storeFile file(rootProject.property("RHVoice.keyStore"))
                storePassword rootProject.property("RHVoice.keyStorePassword")
                keyAlias rootProject.property("RHVoice.keyAlias")
                keyPassword rootProject.property("RHVoice.keyPassword")
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildTypes {
        release {
            if (rootProject.signRelease) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions 'dir'

    productFlavors {
        stable {
            dimension 'dir'
            versionCode = baseVersionCode
        }

        alpha {
            dimension 'dir'
            versionCode = baseVersionCode + 5
            versionNameSuffix '-alpha'
        }

        dev {
            dimension 'dir'
            versionCode = baseVersionCode + 9
            versionNameSuffix '-dev'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    def lifecycle_version = "2.5.1"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.work:work-runtime:2.8.1'

    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.squareup.moshi:moshi:1.14.0'
    implementation 'io.github.vvb2060.ndk:curl:8.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.google.android.material:material:1.12.0'
}

preBuild.dependsOn BoostIncludes

// Generowanie src/main/jni/generated/pkg_config.h z adresem katalogu paczek.
//
// DLACZEGO NIE PER WARIANT (bylo tak w upstreamie i bylo bledne):
// kod natywny buduje sie raz na TYP buildu, nie na wariant - zadania nazywaja sie
// buildNdkBuildDebug[abi] bez nazwy wariantu. Dlatego build stable ciagnie tez
// preDevDebugBuild, oba zadania generujace pisza do TEGO SAMEGO pliku i wygrywa to,
// ktore zapisalo pozniej (w praktyce dev). Efekt: APK stable mial wkompilowany adres
// katalogu DEV - potwierdzone stringami w libRHVoice_jni.so.
// Adres zalezny od wariantu jest w tej konstrukcji nieosiagalny, wiec jest JEDEN adres.
//
// Plik MUSI istniec: package_client.cpp robi #include "pkg_config.h" bezwarunkowo pod ANDROID.
// Nadpisanie: ./gradlew ... -PRHVoice.pkgDirUrl=<url>
ext.defaultPkgDirUrl = 'https://github.com/RHVoice/packages/releases/download/1.18/packages-1.18.json'

def pkgConfigHeader = file("src/main/jni/generated/pkg_config.h")
def pkgDirUrl = findProperty('RHVoice.pkgDirUrl') ?: ext.defaultPkgDirUrl

def generatePkgConfig = tasks.register('generatePkgConfig') {
    outputs.file(pkgConfigHeader)
    inputs.property('url', pkgDirUrl)
    doLast {
        pkgConfigHeader.parentFile.mkdirs()
        pkgConfigHeader.text = "#pragma once\n#define PKG_DIR_URL \"${pkgDirUrl}\"\n"
    }
}

preBuild.dependsOn generatePkgConfig
